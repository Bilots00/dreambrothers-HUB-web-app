<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apri DreamMap</title>
<!-- 0.9.300: il link del promemoria "La tua tappa di DreamMap" nel calendario del telefono.
     I calendari rendono toccabili solo i link https: questa pagina passa la mano all'app
     (dreammap://mappa, dichiarato in AndroidManifest.xml). Se l'app non c'e', porta a /scarica/. -->
<style>
:root{--blu:#0075E3;--notte:#001E44}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0B2A55,var(--notte));font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
main{width:100%;max-width:420px;padding:40px 24px;text-align:center}
h1{margin:0 0 12px;font-size:30px;font-weight:900}
p{margin:0 0 36px;color:#BCE0FF;font-size:16px;line-height:1.5}
a.btn{display:block;padding:18px;border-radius:999px;background:var(--blu);color:#fff;font-weight:800;font-size:18px;text-decoration:none;box-shadow:0 10px 26px rgba(0,117,227,.35)}
a.sec{display:block;margin-top:20px;color:#8CC6FF;font-size:15px;font-weight:700;text-decoration:none}
</style></head><body><main>
<h1>DreamMap</h1>
<p>La tappa di oggi ti aspetta nella Mappa.</p>
<a class="btn" id="apri" href="dreammap://mappa">Apri DreamMap</a>
<a class="sec" href="../scarica/">Non hai l'app? Scaricala</a>
</main>
<script>
(function(){
  var scarica = location.origin + '/scarica/';
  var intento = 'intent://mappa#Intent;scheme=dreammap;package=com.dreambrothers.focuslock;S.browser_fallback_url=' + encodeURIComponent(scarica) + ';end';
  var a = document.getElementById('apri');
  if (/Android/i.test(navigator.userAgent)) {
    a.href = intento;
    /* arrivati dal tocco sul link del calendario: si prova subito, il pulsante resta per il secondo tentativo */
    setTimeout(function(){ location.href = intento; }, 150);
  }
})();
</script>
</body></html>
